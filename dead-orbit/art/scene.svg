<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="渡鸦-7 逃生舱前庭">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b333b"/>
      <stop offset="0.55" stop-color="#1d252c"/>
      <stop offset="1" stop-color="#12181d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39434c"/>
      <stop offset="1" stop-color="#242c33"/>
    </linearGradient>
    <radialGradient id="space" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#101c2e"/>
      <stop offset="0.6" stop-color="#070d18"/>
      <stop offset="1" stop-color="#03060c"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#bcd8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2128"/>
      <stop offset="1" stop-color="#0c1014"/>
    </linearGradient>
    <pattern id="grate" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#161d23"/>
      <path d="M0 0H26M0 13H26M0 0V26M13 0V26" stroke="#222c34" stroke-width="1.5"/>
    </pattern>
    <clipPath id="portClip"><ellipse cx="500" cy="190" rx="112" ry="112"/></clipPath>
  </defs>

  <!-- 舱壁 -->
  <rect width="1000" height="600" fill="url(#wall)"/>
  <!-- 顶部结构梁 -->
  <rect x="0" y="0" width="1000" height="46" fill="#0e1419"/>
  <rect x="0" y="46" width="1000" height="6" fill="#3a444d" opacity="0.5"/>
  <g stroke="#0a0e12" stroke-width="3" opacity="0.7">
    <line x1="150" y1="0" x2="150" y2="46"/>
    <line x1="350" y1="0" x2="350" y2="46"/>
    <line x1="650" y1="0" x2="650" y2="46"/>
    <line x1="850" y1="0" x2="850" y2="46"/>
  </g>
  <!-- 侧壁竖板缝 -->
  <g stroke="#0d1318" stroke-width="2" opacity="0.6">
    <line x1="60" y1="52" x2="60" y2="430"/>
    <line x1="240" y1="52" x2="240" y2="430"/>
    <line x1="760" y1="52" x2="760" y2="430"/>
    <line x1="940" y1="52" x2="940" y2="430"/>
  </g>

  <!-- 地板 -->
  <path d="M0 430 L1000 430 L1000 600 L0 600 Z" fill="url(#floor)"/>
  <path d="M0 430 L1000 430 L1000 600 L0 600 Z" fill="url(#grate)" opacity="0.35"/>
  <line x1="0" y1="430" x2="1000" y2="430" stroke="#48535c" stroke-width="4"/>
  <line x1="0" y1="436" x2="1000" y2="436" stroke="#0a0e12" stroke-width="2"/>

  <!-- 舷窗 -->
  <g>
    <ellipse cx="500" cy="190" rx="128" ry="128" fill="#0a0f16" stroke="#3d4852" stroke-width="10"/>
    <ellipse cx="500" cy="190" rx="118" ry="118" fill="url(#space)"/>
    <g clip-path="url(#portClip)">
      <!-- 星海 -->
      <g fill="#dce9ff">
        <circle cx="430" cy="120" r="2.2"/><circle cx="470" cy="150" r="1.4"/>
        <circle cx="560" cy="130" r="1.8"/><circle cx="600" cy="180" r="1.2"/>
        <circle cx="410" cy="220" r="1.6"/><circle cx="540" cy="250" r="2"/>
        <circle cx="580" cy="230" r="1.3"/><circle cx="455" cy="265" r="1.5"/>
        <circle cx="500" cy="105" r="1.2"/><circle cx="620" cy="140" r="1.7"/>
        <circle cx="390" cy="170" r="1.3"/><circle cx="520" cy="200" r="1"/>
      </g>
      <!-- 三颗信标星（亮度不同，视觉对应数字，不靠颜色） -->
      <circle cx="440" cy="150" r="16" fill="url(#starGlow)"/>
      <circle cx="440" cy="150" r="4.5" fill="#ffffff"/>
      <circle cx="570" cy="135" r="11" fill="url(#starGlow)" opacity="0.8"/>
      <circle cx="570" cy="135" r="3.2" fill="#e6f0ff"/>
      <circle cx="520" cy="255" r="7" fill="url(#starGlow)" opacity="0.6"/>
      <circle cx="520" cy="255" r="2.2" fill="#cfe0f5"/>
      <!-- 远处恒星（微弱的橙红弧） -->
      <path d="M380 300 Q500 250 620 300" stroke="#7a3a22" stroke-width="3" fill="none" opacity="0.5"/>
    </g>
    <!-- 舷窗螺栓 -->
    <g fill="#5a666f">
      <circle cx="500" cy="62" r="4"/><circle cx="628" cy="190" r="4"/>
      <circle cx="500" cy="318" r="4"/><circle cx="372" cy="190" r="4"/>
      <circle cx="390" cy="80" r="3.5"/><circle cx="610" cy="80" r="3.5"/>
      <circle cx="390" cy="300" r="3.5"/><circle cx="610" cy="300" r="3.5"/>
    </g>
  </g>

  <!-- 储物柜（左） -->
  <g>
    <rect x="40" y="126" width="160" height="300" rx="6" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <line x1="120" y1="126" x2="120" y2="426" stroke="#0d1318" stroke-width="3"/>
    <rect x="98" y="270" width="10" height="28" rx="3" fill="#7d8891"/>
    <rect x="132" y="270" width="10" height="28" rx="3" fill="#7d8891"/>
    <rect x="52" y="140" width="56" height="10" rx="2" fill="#4a555e"/>
    <rect x="132" y="140" width="56" height="10" rx="2" fill="#4a555e"/>
  </g>

  <!-- 导航终端（左中） -->
  <g>
    <rect x="240" y="174" width="140" height="186" rx="8" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <rect x="252" y="188" width="116" height="86" rx="4" fill="#0a161c" stroke="#2e3a42" stroke-width="2"/>
    <g stroke="#1c3a42" stroke-width="1" opacity="0.5">
      <line x1="252" y1="210" x2="368" y2="210"/><line x1="252" y1="232" x2="368" y2="232"/>
      <line x1="252" y1="254" x2="368" y2="254"/>
    </g>
    <circle cx="270" cy="300" r="8" fill="#3a464f"/><circle cx="298" cy="300" r="8" fill="#3a464f"/>
    <circle cx="326" cy="300" r="8" fill="#3a464f"/><circle cx="354" cy="300" r="8" fill="#3a464f"/>
    <rect x="252" y="322" width="116" height="24" rx="3" fill="#151d23"/>
  </g>

  <!-- 生命维持面板（右中） -->
  <g>
    <rect x="620" y="174" width="150" height="186" rx="8" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <rect x="632" y="188" width="126" height="86" rx="4" fill="#0a161c" stroke="#2e3a42" stroke-width="2"/>
    <g stroke="#1c3a42" stroke-width="1" opacity="0.5">
      <line x1="632" y1="210" x2="758" y2="210"/><line x1="632" y1="232" x2="758" y2="232"/>
      <line x1="632" y1="254" x2="758" y2="254"/>
    </g>
    <rect x="640" y="288" width="46" height="20" rx="3" fill="#151d23" stroke="#3a464f" stroke-width="2"/>
    <rect x="700" y="288" width="46" height="20" rx="3" fill="#151d23" stroke="#3a464f" stroke-width="2"/>
    <circle cx="663" cy="332" r="9" fill="#3a464f"/><circle cx="723" cy="332" r="9" fill="#3a464f"/>
  </g>

  <!-- 逃生舱门（右） -->
  <g>
    <rect x="800" y="114" width="170" height="354" rx="10" fill="#202830" stroke="#0a0e12" stroke-width="4"/>
    <rect x="812" y="126" width="146" height="330" rx="6" fill="url(#panel)" stroke="#3d4852" stroke-width="2"/>
    <path d="M812 126 L958 456 M958 126 L812 456" stroke="#0d1318" stroke-width="2" opacity="0.5"/>
    <ellipse cx="885" cy="291" rx="42" ry="42" fill="#0e151b" stroke="#4a555e" stroke-width="5"/>
    <ellipse cx="885" cy="291" rx="26" ry="26" fill="#18222a" stroke="#2e3a42" stroke-width="2"/>
    <circle cx="885" cy="291" r="8" fill="#c0532a"/>
    <rect x="852" y="140" width="66" height="12" rx="2" fill="#c0532a" opacity="0.8"/>
    <text x="885" y="150" font-family="monospace" font-size="9" fill="#ffd9c4" text-anchor="middle" letter-spacing="1">LOCKED</text>
  </g>

  <!-- 逃生舱座椅（中下） -->
  <g>
    <path d="M420 470 Q420 400 500 400 Q580 400 580 470 L580 520 L420 520 Z" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <rect x="430" y="470" width="140" height="40" rx="8" fill="#2a333b" stroke="#0d1318" stroke-width="2"/>
    <rect x="440" y="512" width="120" height="14" rx="3" fill="#151d23"/>
    <path d="M452 400 Q452 370 500 370 Q548 370 548 400" fill="none" stroke="#3d4852" stroke-width="8"/>
    <rect x="470" y="530" width="60" height="10" rx="2" fill="#3a464f"/>
  </g>

  <!-- 发射控制台（左下） -->
  <g>
    <path d="M230 470 L370 470 L390 560 L210 560 Z" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <rect x="248" y="482" width="104" height="40" rx="4" fill="#0a161c" stroke="#2e3a42" stroke-width="2"/>
    <g fill="#3a464f">
      <circle cx="262" cy="540" r="7"/><circle cx="286" cy="540" r="7"/><circle cx="310" cy="540" r="7"/>
      <circle cx="334" cy="540" r="7"/><circle cx="358" cy="540" r="7"/>
    </g>
  </g>

  <!-- 工具箱（右下） -->
  <g>
    <rect x="620" y="470" width="160" height="80" rx="6" fill="url(#panel)" stroke="#0d1318" stroke-width="3"/>
    <rect x="620" y="470" width="160" height="18" rx="6" fill="#2f3941" stroke="#0d1318" stroke-width="2"/>
    <rect x="686" y="466" width="28" height="12" rx="3" fill="#7d8891"/>
    <line x1="620" y1="510" x2="780" y2="510" stroke="#0d1318" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 管线细节 -->
  <g fill="none" stroke="#0d1318" stroke-width="6" opacity="0.7">
    <path d="M0 70 Q120 70 120 110 L120 174"/>
    <path d="M1000 70 Q880 70 880 110 L880 114"/>
    <path d="M0 400 Q80 400 80 430"/>
  </g>
  <g fill="none" stroke="#3a464f" stroke-width="2" opacity="0.5">
    <path d="M0 70 Q120 70 120 110 L120 174"/>
    <path d="M1000 70 Q880 70 880 110 L880 114"/>
  </g>

  <!-- 警示条纹 -->
  <g opacity="0.6">
    <path d="M0 436 L40 436 L10 452 L0 452 Z" fill="#c0532a"/>
    <path d="M80 436 L120 436 L90 452 L50 452 Z" fill="#c0532a"/>
    <path d="M160 436 L200 436 L170 452 L130 452 Z" fill="#c0532a"/>
    <path d="M880 436 L920 436 L890 452 L850 452 Z" fill="#c0532a"/>
    <path d="M960 436 L1000 436 L970 452 L930 452 Z" fill="#c0532a"/>
  </g>
</svg>
