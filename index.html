<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="独立文件夹组织的开源网页游戏列表">
  <title>网页游戏合集</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; font-family: system-ui, sans-serif; background: #eff5ef; color: #203326; line-height: 1.7; }
    main { max-width: 780px; margin: auto; }
    h1 { line-height: 1.3; }
    ul { padding: 0; list-style: none; }
    article { padding: 24px; background: white; border: 1px solid #ccdccc; border-radius: 16px; }
    a { color: #176436; text-underline-offset: 4px; }
    .play { display: inline-block; padding: 10px 20px; background: #176436; color: white; border-radius: 8px; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ce8612; outline-offset: 4px; }
    footer { margin-top: 32px; font-size: 0.9rem; color: #425747; }
  </style>
</head>
<body>
  <main>
    <h1>网页游戏合集</h1>
    <p>每个游戏一个文件夹。当前收录 1 个游戏。</p>
    <ul aria-label="游戏清单">
      <li>
        <article>
          <h2>Plants vs Zombies（非官方粉丝实现）</h2>
          <p>收集阳光、种植防线、抵挡僵尸。使用 emoji、文字与 CSS 的开源塔防小游戏，代码采用 MIT 许可证。</p>
          <p><a class="play" href="./plants-vs-zombies/">进入游戏</a></p>
          <p><a href="./plants-vs-zombies/README.md">玩法与运行说明</a> · <a href="./plants-vs-zombies/ATTRIBUTION.md">来源与改动</a> · <a href="./plants-vs-zombies/LICENSE">MIT 许可证</a></p>
        </article>
      </li>
    </ul>
    <footer>非官方项目，与 PopCap / EA 无关。仓库内不含任何原版素材；相关名称、商标及玩法权益归各自权利人。</footer>
  </main>
</body>
</html>
